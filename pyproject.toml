[project]
name = "tree-break-selection"
version = "0.1.0"
description = "Tree-Break Selection hierarchy decomposition with projected-Wald gate testing"
requires-python = ">=3.11"
authors = [
    {name = "Tree-Break Selection contributors"}
]
readme = "README.md"
license = {file = "LICENSE"}

dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.24.0,<2.4",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.24.0",
    "pydiffmap>=0.2.0.1",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "deptry>=0.12.0",
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "notebook>=7.0.0",
    "pytest>=7.4.0",
    "pypdf>=5.0.0",
    "ruff>=0.15.6",
    "vulture>=2.15",
]
benchmark = [
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "hdbscan>=0.8.41",
]
benchmark-infra = [
    "asv>=0.6.6",
    "clustering-benchmarks>=1.1.6",
    "openml>=0.15.0",
]
diffusion = [
    "pygsp>=0.6.1",
]
trajectory = [
    "deeptime>=0.4.5",
]
viz = [
    "bokeh>=3.0.0",
    "pillow>=10.0.0",
    "scikit-bio>=0.6.0",
    "umap-learn>=0.5.11",
    "kaleido>=0.2.1",
    "pypdf>=5.0.0",
    "pygraphviz>=2.0",
]
all = [
    "bokeh>=3.0.0",
    "deptry>=0.12.0",
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "notebook>=7.0.0",
    "pytest>=7.4.0",
    "ruff>=0.15.6",
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "hdbscan>=0.8.41",
    "scikit-bio>=0.6.0",
    "umap-learn>=0.5.11",
    "kaleido>=0.2.1",
    "pypdf>=5.0.0",
    "pygraphviz>=2.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "pygsp>=0.6.1",
    "deeptime>=0.4.5",
    "asv>=0.6.6",
    "clustering-benchmarks>=1.1.6",
    "openml>=0.15.0",
    "vulture>=2.15",
]
experimental-gpl = [
    "graphtools>=2.1.0",
    "phate>=2.0.0",
]
brancharchitect = [
    "biopython>=1.85",
    "orjson>=3.10.0",
]
scrna = [
    "anndata>=0.10.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "scanpy>=1.10.0",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["*test_*.py"]
markers = [
    "slow: long-running integration and regression coverage",
    "optional: requires a dependency or runtime outside the lean development environment",
    "scrna: requires the optional single-cell RNA dependency stack",
    "graphtools: requires the optional GPL graphtools backend",
    "r_runtime: requires an external Rscript runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["applications", "benchmarks", "tree_break_selection", "scripts", "tests"]
force-exclude = true
extend-exclude = [
    "manuscript",
    "vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.deptry]
ignore_notebooks = true
known_first_party = ["applications", "benchmarks", "tree_break_selection", "brancharchitect"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["^manuscript/", "^vendor/"]
package_module_name_map = { "biopython" = "Bio", "clustering-benchmarks" = "clustbench", "scikit-bio" = "skbio" }

[tool.deptry.per_rule_ignores]
# CLI tools, dynamic adapters, renderer backends, and optional research runtimes
# do not appear as direct static imports in the audited source paths.
DEP002 = ["asv", "biopython", "clustering-benchmarks", "deeptime", "deptry", "ipython", "jupyter", "kaleido", "notebook", "openml", "orjson", "phate", "pygraphviz", "pygsp", "pytest", "ruff", "vulture"]
DEP001 = ["tensorflow"]
